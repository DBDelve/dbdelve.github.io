name: Sponsors

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sponsors
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check the Patreon token
        env:
          SPONSORKIT_PATREON_TOKEN: ${{ secrets.SPONSORKIT_PATREON_TOKEN }}
        run: |
          if [ -z "$SPONSORKIT_PATREON_TOKEN" ]; then
            echo "::error::The SPONSORKIT_PATREON_TOKEN secret is not set. Create a Patreon client at https://www.patreon.com/portal/registration/register-clients and add its Creator's Access Token as a repository secret named SPONSORKIT_PATREON_TOKEN."
            exit 1
          fi

      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: sponsorkit/package-lock.json

      - name: Install sponsorkit
        working-directory: sponsorkit
        run: npm ci

      - name: Fetch sponsors and render
        working-directory: sponsorkit
        env:
          SPONSORKIT_PATREON_TOKEN: ${{ secrets.SPONSORKIT_PATREON_TOKEN }}
        run: npx --no-install sponsorkit --force

      - name: Commit changes
        run: |
          git add sponsors
          if git diff --cached --quiet; then
            echo "Sponsors unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update sponsors"
          git push
